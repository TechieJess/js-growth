<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Marvelous List</title>
</head>
<body>
    <div class="wrapper">
        <h1>Marvelous List</h1>
        <div class="container">

            <ul class="movie-list">
                <li data-title="Avengers: Endgame">Avengers: Endgame</li>
                <li data-title="Doctor Strange">Doctor Strange</li>
                <li data-title="Black Panther">Black Panther</li>
                <li data-title="Spider-Man: Homecoming">Spiderman: Homecoming</li>
            </ul>

            <div class="film-details">
                <div class="content">
                    <h2>👈 Select a film to see details</h2>
                    <p class="film-date"></p>
                    <div class="actors"></div>
                    <p class="film-info"></p>
                </div>
                <img src="" alt="">
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
