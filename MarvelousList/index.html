<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Marvelous List</title>
</head>
<body>
    <div class="wrapper">
        <h1>Marvelous List</h1>
        <div class="container">

            <ul class="movie-list">
                <li data-title = "Avengers: Endgame" 
                    data-date = "April 22, 2019"
                    data-actors = "Robert Downey Jr., Chris Evans, Mark Ruffalo, Chris Hemsworth, Scarlett Johansson"
                    data-info = "After the devastating events of Avengers: Infinity War, the universe has been left in ruins because of Thanos' actions. With half of all life wiped out, the remaining Avengers must reunite for one final mission. Together with old allies, they travel through time in a desperate attempt to reverse the snap, restore hope to humanity, and defeat Thanos once and for all."
                    data-image = "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg">
                    Avengers: Endgame
                </li>

                <li data-title="Doctor Strange"
                    data-date = "November 4, 2016"
                    data-actors = "Benedict Cumberbatch, Chiwetel Ejiofor, Rachel McAdams, Benedict Wong, Tilda Swinton"
                    data-info = "Dr. Stephen Strange is a brilliant but arrogant neurosurgeon whose life changes forever after a terrible car accident damages his hands. While searching for a cure, he discovers the hidden world of mystic arts and powerful sorcerers. Forced to embrace his new destiny, Strange learns to protect Earth from dangerous threats that exist beyond time and space."
                    data-image = "https://image.tmdb.org/t/p/w500/uGBVj3bEbCoZbDjjl9wTxcygko1.jpg"> 
                    Doctor Strange
                </li>

                <li data-title="Black Panther"
                    data-date = "February 16, 2018"
                    data-actors =  "Chadwick Boseman, Michael B. Jordan, Lupita Nyong'o, Danai Gurira, Letitia Wright"
                    data-info = "Following the death of his father, T'Challa returns to the technologically advanced nation of Wakanda to take his rightful place as king. However, his leadership is challenged by a powerful enemy with a personal connection to Wakanda's past. As Black Panther, T'Challa must protect his people, defend his kingdom, and decide what kind of ruler he wants to become."
                    data-image = "https://image.tmdb.org/t/p/w500/uxzzxijgPIY7slzFvMotPv8wjKA.jpg"> 
                    Black Panther
                    </li>

                <li data-title="Spider-Man: Homecoming"
                    data-date = "July 7, 2017"
                    data-actors = "Tom Holland, Michael Keaton, Zendaya, Jacob Batalon, Robert Downey Jr."
                    data-info = "After fighting alongside the Avengers, Peter Parker returns to his everyday life as a high school student in Queens. Eager to prove that he is more than just a neighborhood superhero, Peter takes on the dangerous Vulture, whose powerful alien technology threatens the city. Along the way, he learns that being a true hero means accepting responsibility and making difficult choices."
                    data-image = "https://image.tmdb.org/t/p/w500/c24sv2weTHPsmDa7jEMN0m2P3RT.jpg"> 
                    Spider-Man: Homecoming
                </li>
            </ul>

            <div class="film-details">
                <div class="content">
                    <h2></h2>
                    <p class="film-date"></p>
                    <div class="actors"></div>
                    <p class="film-info"></p>
                </div>
                <img src="" alt="">
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
