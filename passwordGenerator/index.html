<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <title>Password Generator</title>
</head>
<body>
    <div class="card">
        <h2>Password Generator</h2>
        <div class="generator">
            <output id="password">P4$5W0rD!</output> 
                <button id="copy" aria-label="Copy to clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
        </div>
    <div class="container">
        <div class="requirements">
            <div class="range">
                <div class="number">
                    <label for="length">Character Length</label>
                    <span class="character-length">0</span>
                </div>
                <input type="range" id="length" min="0" max="24" value="0">
            </div>
            <fieldset>
                <legend class="visually-hidden">Password Requirements</legend>
                <div class="checkboxes">
                    <div class="checkbox">
                        <input type="checkbox" name="options" id="uppercase"><label for="uppercase">Include Uppercase Letters</label>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" name="options" id="lowercase"><label for="lowercase">Include Lowercase Letters</label>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" name="options" id="numbers"><label for="numbers">Include Numbers</label>
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" name="options" id="symbols"><label for="symbols">Include Symbols</label>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="strength-indicator">
            <p>STRENGTH</p>
            <output name="strength-indicator" for="length uppercase lowercase numbers symbols">
                <span class="strength-text"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </output>
        </div>
        <div class="generate">
            <button id="generate">GENERATE
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/></svg>
            </button>
        </div>
    </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
